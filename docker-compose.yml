services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentmesh
      POSTGRES_PASSWORD: agentmesh
      POSTGRES_DB: agentmesh
    ports:
      - "5433:5432"
    volumes:
      - agentmesh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://agentmesh:agentmesh@postgres:5432/agentmesh?sslmode=disable
      PORT: 8080
      BASE_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      # Dev-only fixed secret — never reuse in production.
      JWT_SECRET: 5a06faa3d53450f33cb2d4727f7c4bc4b030e0fdd9ddd8995ea0c8a797905a0a
      # Must be the key the wallet ciphertexts below were encrypted with.
      # Compose reads it from the gitignored ./.env (a symlink to backend/.env).
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in backend/.env}

      # Whitechain testnet. Blank in .env still lands on these defaults.
      FACILITATOR_URL: ${FACILITATOR_URL:-https://whitechain.007575.xyz}
      WHITECHAIN_RPC_URL: ${WHITECHAIN_RPC_URL:-https://rpc.testnet.whitechain.io}
      WHITECHAIN_EXPLORER_URL: ${WHITECHAIN_EXPLORER_URL:-https://explorer.testnet.whitechain.io}

      # Platform provider keys, taken from .env so the chat builder and any
      # platform-key agent work in local dev. Without a Gemini key the
      # builder answers 503 "workflow builder is not configured".
      PLATFORM_GEMINI_API_KEY: ${PLATFORM_GEMINI_API_KEY:-}
      PLATFORM_OPENAI_API_KEY: ${PLATFORM_OPENAI_API_KEY:-}
      PLATFORM_ANTHROPIC_API_KEY: ${PLATFORM_ANTHROPIC_API_KEY:-}

      # Whitechain wallets. Wallet 1 pays each run's pre-fund and the platform
      # fee; Wallet 2 receives that and pays outbound x402 tools. Ciphertexts
      # come from `go run ./cmd/walletgen -enc-key $ENCRYPTION_KEY -import -`.
      # They are not hardcoded: the dev key that used to live here cannot
      # decrypt them, and committing a ciphertext made with a published key
      # would publish the private key.
      PLATFORM_SPEND_WALLET_ADDRESS: ${PLATFORM_SPEND_WALLET_ADDRESS:?set in backend/.env}
      PLATFORM_SPEND_WALLET_ENC_KEY: ${PLATFORM_SPEND_WALLET_ENC_KEY:?set in backend/.env}
      PLATFORM_WALLET_ADDRESS: ${PLATFORM_WALLET_ADDRESS:?set in backend/.env}
      PLATFORM_WALLET_ENC_KEY: ${PLATFORM_WALLET_ENC_KEY:?set in backend/.env}

      # Cashfree — replace with real keys from dashboard.cashfree.com
      # Set CASHFREE_SANDBOX=true while testing
      CASHFREE_APP_ID: your_cashfree_app_id_here
      CASHFREE_SECRET_KEY: your_cashfree_secret_key_here
      CASHFREE_SANDBOX: "true"

      # NOWPayments (crypto top-ups) — replace with real keys
      NOWPAYMENTS_API_KEY: placeholder_nowpayments_key
      NOWPAYMENTS_IPN_SECRET: placeholder_nowpayments_ipn_secret
      NOWPAYMENTS_SANDBOX: "false"

      # OAuth connector credentials — replace with real keys from each provider's dev console.
      # Register redirect URI: http://localhost:3000/api/connectors/oauth/{provider}/callback
      # Leave as placeholder to keep the route alive; real keys needed to complete the flow.
      SLACK_OAUTH_CLIENT_ID: placeholder_slack_client_id
      SLACK_OAUTH_CLIENT_SECRET: placeholder_slack_client_secret
      GITHUB_CONNECTOR_CLIENT_ID: placeholder_github_connector_client_id
      GITHUB_CONNECTOR_CLIENT_SECRET: placeholder_github_connector_client_secret
      NOTION_CLIENT_ID: placeholder_notion_client_id
      NOTION_CLIENT_SECRET: placeholder_notion_client_secret
      AIRTABLE_CLIENT_ID: placeholder_airtable_client_id
      AIRTABLE_CLIENT_SECRET: placeholder_airtable_client_secret
      HUBSPOT_CLIENT_ID: placeholder_hubspot_client_id
      HUBSPOT_CLIENT_SECRET: placeholder_hubspot_client_secret
      ASANA_CLIENT_ID: placeholder_asana_client_id
      ASANA_CLIENT_SECRET: placeholder_asana_client_secret
      CLICKUP_CLIENT_ID: placeholder_clickup_client_id
      CLICKUP_CLIENT_SECRET: placeholder_clickup_client_secret
      JIRA_CLIENT_ID: placeholder_jira_client_id
      JIRA_CLIENT_SECRET: placeholder_jira_client_secret
      LINEAR_CLIENT_ID: placeholder_linear_client_id
      LINEAR_CLIENT_SECRET: placeholder_linear_client_secret
      MAILCHIMP_CLIENT_ID: placeholder_mailchimp_client_id
      MAILCHIMP_CLIENT_SECRET: placeholder_mailchimp_client_secret
      GITLAB_CLIENT_ID: placeholder_gitlab_client_id
      GITLAB_CLIENT_SECRET: placeholder_gitlab_client_secret
      TODOIST_CLIENT_ID: placeholder_todoist_client_id
      TODOIST_CLIENT_SECRET: placeholder_todoist_client_secret

volumes:
  agentmesh_pgdata:
